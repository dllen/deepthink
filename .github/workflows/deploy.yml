name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # No cache: 'npm' — that option requires a lockfile (which we
        # intentionally don't track; see .gitignore + commit d77d75b).

    - name: Install dependencies
      # No package-lock.json in the repo — resolves all packages from the
      # public registry (https://registry.npmjs.org/) which is the CI default.
      run: npm install --legacy-peer-deps

    # Build/deploy does not regenerate data: it uses the committed
    # static-data.js/json directly. `check:data` below reads the plaintext
    # DB with sql.js and verifies the generated files are consistent with it;
    # no database decryption step is involved.

    - name: Run data rule tests
      run: npm run test:data

    - name: Check data consistency
      run: npm run check:data

    - name: Build project
      run: npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
