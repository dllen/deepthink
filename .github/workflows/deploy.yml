name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version: '20'
        # No cache: 'npm' — keep the workflow simple; `npm ci` is already
        # fast against the committed lockfile.

    - name: Install dependencies
      # package-lock.json is committed (resolved from the public registry),
      # so install exactly the locked dependency tree.
      run: npm ci

    # Build/deploy does not regenerate data: it uses the committed
    # static-data.js/json directly. The plaintext DB is NOT tracked in git;
    # the `Decrypt database` step below restores it from web_content.db.enc
    # with the SQLITE_KEY secret so `check:data` can verify it with sql.js.

    - name: Decrypt database
      env:
        SQLITE_KEY: ${{ secrets.SQLITE_KEY }}
      run: |
        if [ -z "$SQLITE_KEY" ]; then
          echo "::error::SQLITE_KEY secret is not set"
          exit 1
        fi
        ./scripts/decrypt-db.sh

    - name: Run data rule tests
      run: npm run test:data

    - name: Check data consistency
      run: npm run check:data

    - name: Build project
      run: npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847  # v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
