name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # No cache: 'npm' — that option requires a lockfile (which we
        # intentionally don't track; see .gitignore + commit d77d75b).

    - name: Install dependencies
      # No package-lock.json in the repo — resolves all packages from the
      # public registry (https://registry.npmjs.org/) which is the CI default.
      run: npm install --legacy-peer-deps

    # Use committed static-data.js/json directly. In-CI regeneration requires
    # sql.js + a database decrypt step, which were intentionally removed in
    # 5c10e48 (see comment there). Re-enable only after fixing the install
    # to use public registry (package-lock.json currently points to an
    # internal registry that GH runners can't reach).

    - name: Build project
      run: npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
