name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # PRs get their own group (refs/pull/N/merge), so a PR run can never cancel
  # a production deploy. Pushes to main and manual dispatches share
  # refs/heads/main, where a new run still cancels an in-progress old one.
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version: '20'
        # No cache: 'npm' — keep the workflow simple; `npm ci` is already
        # fast against the committed lockfile.

    - name: Install dependencies
      # package-lock.json is committed (resolved from the public registry),
      # so install exactly the locked dependency tree.
      run: npm ci

    # Build/deploy does not regenerate data: it uses the committed
    # static-data.js/json directly. The plaintext DB is NOT tracked in git;
    # the `Decrypt database` step below restores it from web_content.db.enc
    # with the SQLITE_KEY secret so `check:data` can verify it with sql.js.

    - name: Decrypt database
      id: decrypt
      env:
        SQLITE_KEY: ${{ secrets.SQLITE_KEY }}
      run: |
        if [ -z "$SQLITE_KEY" ]; then
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::warning::SQLITE_KEY not available (fork PR?) — skipping database checks"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::SQLITE_KEY secret is not set"
          exit 1
        fi
        ./scripts/decrypt-db.sh

    - name: Run data rule tests
      run: npm run test:data

    - name: Check data consistency
      if: steps.decrypt.outputs.skipped != 'true'
      run: npm run check:data

    - name: Build project
      run: npm run build

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847  # v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages

    # Cloudflare may serve an old index or a 200 fallback after a deploy, so a
    # bare status check proves nothing: compare the asset name with this build.
    - name: Smoke test production
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      run: |
        set -euo pipefail
        EXPECTED=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1 || true)
        EXPECTED_CSS=$(grep -o 'assets/index-[^"]*\.css' dist/index.html | head -1 || true)
        if [ -z "$EXPECTED" ] || [ -z "$EXPECTED_CSS" ]; then
          echo "::error::could not find built JS/CSS assets in dist/index.html"
          exit 1
        fi
        echo "Expected JS asset: $EXPECTED"
        echo "Expected CSS asset: $EXPECTED_CSS"

        BASE="https://deepthink.global"
        OK=0
        code=""
        ctype=""
        actual=""
        for attempt in 1 2 3 4 5 6; do
          code=$(curl -sS -m 15 -o /tmp/index.html -w '%{http_code}' "$BASE/" || true)
          ctype=$(curl -sSI -m 15 "$BASE/" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}' | head -1 || true)
          actual=$(grep -o 'assets/index-[^"]*\.js' /tmp/index.html | head -1 || true)
          echo "attempt $attempt: status=$code content-type=$ctype asset=$actual"
          if [ "$code" = "200" ] && echo "$ctype" | grep -qi 'text/html' && [ "$actual" = "$EXPECTED" ]; then
            OK=1
            break
          fi
          if [ "$attempt" -lt 6 ]; then
            sleep 10
          fi
        done
        if [ "$OK" != "1" ]; then
          echo "::error::production index did not match the deployed build (expected status=200 content-type=text/html asset=$EXPECTED; last status=$code content-type=$ctype asset=$actual)"
          exit 1
        fi

        acode=$(curl -sS -m 15 -o /tmp/app.js -w '%{http_code}' "$BASE/$EXPECTED" || true)
        atype=$(curl -sSI -m 15 "$BASE/$EXPECTED" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}' | head -1 || true)
        echo "asset: status=$acode content-type=$atype"
        if [ "$acode" != "200" ] || ! echo "$atype" | grep -qi 'javascript'; then
          echo "::error::deployed asset is missing or wrong content-type (expected status=200 content-type=javascript; $EXPECTED: status=$acode content-type=$atype)"
          exit 1
        fi

        ccode=$(curl -sS -m 15 -o /tmp/app.css -w '%{http_code}' "$BASE/$EXPECTED_CSS" || true)
        cstype=$(curl -sSI -m 15 "$BASE/$EXPECTED_CSS" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}' | head -1 || true)
        echo "css: status=$ccode content-type=$cstype"
        if [ "$ccode" != "200" ] || ! echo "$cstype" | grep -qi 'text/css'; then
          echo "::error::deployed CSS is missing or wrong content-type (expected status=200 content-type=text/css; $EXPECTED_CSS: status=$ccode content-type=$cstype)"
          exit 1
        fi

        lcode=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$BASE/logo.svg" || true)
        ltype=$(curl -sSI -m 15 "$BASE/logo.svg" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}' | head -1 || true)
        echo "logo: status=$lcode content-type=$ltype"
        if [ "$lcode" != "200" ] || ! echo "$ltype" | grep -qi 'image/svg'; then
          echo "::error::logo.svg missing or wrong content-type (expected status=200 content-type=image/svg+xml; status=$lcode content-type=$ltype)"
          exit 1
        fi

        echo "Production smoke passed"
